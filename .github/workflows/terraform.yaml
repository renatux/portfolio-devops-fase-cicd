name: Provisiona Ambiente Portfolio

on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: 'Qual ambiente (dev, staging ou prod)?'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      apply:
        description: 'Executar o terraform apply?'
        required: true
        default: 'false'
        type: choice
        options:
          - true
          - false
      destroy:
        description: 'Destruir ambiente?'
        required: true
        default: 'false'
        type: choice
        options:
          - true
          - false
      plan_destroy:
        description: 'Planejar o destroy do ambiente?'
        required: true
        default: 'false'
        type: choice
        options:
          - true
          - false

permissions:
  id-token: write
  contents: read

jobs:
  job1:
    name: Terraform ${{ github.event.inputs.ambiente }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::614879421397:role/GithubActionsRole
          aws-region: us-east-1

      - name: HashiCorp - Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1

      - name: Terraform Init
        run: terraform init -input=false
        working-directory: infra/${{ github.event.inputs.ambiente }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: infra/${{ github.event.inputs.ambiente }}

      - name: Terraform Plan
        run: terraform plan -input=false -var-file=../common.tfvars -var-file=${{ github.event.inputs.ambiente }}.tfvars -out=tfplan
        working-directory: infra/${{ github.event.inputs.ambiente }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: infra/${{ github.event.inputs.ambiente }}
        if: github.event.inputs.apply == 'true'

      - name: Plan Destroy
        run: terraform plan -destroy -input=false -var-file=../common.tfvars -var-file=${{ github.event.inputs.ambiente }}.tfvars -out=tfplandestroy
        working-directory: infra/${{ github.event.inputs.ambiente }}
        if: github.event.inputs.plan_destroy == 'true'

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -var-file=../common.tfvars -var-file=${{ github.event.inputs.ambiente }}.tfvars
        working-directory: infra/${{ github.event.inputs.ambiente }}
        if: github.event.inputs.destroy == 'true'
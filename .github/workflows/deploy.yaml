          STATUS=$(aws ssm get-command-invocation --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" --query "Status" --output text)
          if [ "${STATUS}" != "Success" ]; then exit 1; fi

  prod:
    name: Deploy prod
    runs-on: ubuntu-latest
    environment: prod
    concurrency: deploy-prod
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::614879421397:role/GithubActionsRepoApp

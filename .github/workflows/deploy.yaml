name: Pipeline de Deploy do Portfolio

on:
  push:
    branches: [develop, main]
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

jobs:
  dev:
    name: Deploy dev
    runs-on: ubuntu-latest
    environment: dev
    concurrency: deploy-dev
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::614879421397:role/GithubActionsRepoApp
          aws-region: us-east-1

      - name: AWS ECR Docker Login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push com tag do ambiente
        run: |
          SHA=$(git rev-parse --short "$GITHUB_SHA")
          TAG="dev-${SHA}"
          docker build -f website/Dockerfile -t "site:${TAG}" .
          docker tag "site:${TAG}" "614879421397.dkr.ecr.us-east-1.amazonaws.com/webportfolio:${TAG}"
          docker push "614879421397.dkr.ecr.us-east-1.amazonaws.com/webportfolio:${TAG}"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Deploy via SSM na instancia
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=website-server-dev" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          echo "Instancia alvo: ${INSTANCE_ID}"

          cat > /tmp/ssm-commands.json << CMDEOF
          {
            "commands": [
              "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 614879421397.dkr.ecr.us-east-1.amazonaws.com",
              "docker pull 614879421397.dkr.ecr.us-east-1.amazonaws.com/webportfolio:${TAG}",
              "docker stop app-site || true",
              "docker rm app-site || true",
              "docker run -d --name app-site -p 80:80 614879421397.dkr.ecr.us-east-1.amazonaws.com/webportfolio:${TAG}",
              "docker ps -a"
            ]
          }
          CMDEOF

          COMMAND_ID=$(aws ssm send-command --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-commands.json \
            --query "Command.CommandId" --output text)
          aws ssm wait command-executed --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}"
          STATUS=$(aws ssm get-command-invocation --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" --query "Status" --output text)
          if [ "${STATUS}" != "Success" ]; then exit 1; fi

  staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    environment: staging
    concurrency: deploy-staging
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout

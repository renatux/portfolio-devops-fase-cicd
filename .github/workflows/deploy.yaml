name: Pipeline de Deploy do Portfolio

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::614879421397:role/GithubActionsRepoApp
          aws-region: us-east-1

      - name: AWS ECR Docker Login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag e push Docker Image
        run: |
          docker build -f website/Dockerfile -t portfolio-devops-fase-cicd:v0.1 .
          docker tag portfolio-devops-fase-cicd:v0.1 614879421397.dkr.ecr.us-east-1.amazonaws.com/webportfolio:v0.1
          docker push 614879421397.dkr.ecr.us-east-1.amazonaws.com/webportfolio:v0.1

  deploy-ec2:
    name: Deploy no AWS EC2
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::614879421397:role/GithubActionsRepoApp
          aws-region: us-east-1

      - name: Deploy no EC2 via SSM Run Command
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=website-server" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          echo "Instancia alvo: ${INSTANCE_ID}"

          cat > /tmp/ssm-commands.json << 'CMDEOF'
          {
            "commands": [
              "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 614879421397.dkr.ecr.us-east-1.amazonaws.com",
              "docker pull 614879421397.dkr.ecr.us-east-1.amazonaws.com/webportfolio:v0.1",
              "docker stop app-site || true",
              "docker rm app-site || true",
              "docker run -d --name app-site -p 80:80 614879421397.dkr.ecr.us-east-1.amazonaws.com/webportfolio:v0.1",
              "docker ps -a"
            ]
          }
          CMDEOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy webportfolio v0.1" \
            --parameters file:///tmp/ssm-commands.json \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId: ${COMMAND_ID}"

          aws ssm wait command-executed --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" \
            --query "Status" --output text)
          echo "SSM Status final: ${STATUS}"

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" \
            --query "StandardOutputContent" --output text

          if [ "${STATUS}" != "Success" ]; then
            echo "Deploy remoto falhou"
            exit 1
          fi